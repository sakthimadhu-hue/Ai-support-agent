<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Learning Study Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🤖 AI Learning Study Assistant</h1>
    <p class="subtitle">Your Smart Study Companion</p>

    <!-- Study Plan -->
    <div class="card">
        <h2>📚 Generate Study Plan</h2>

        <label>Subject</label>
        <input type="text" id="subject" placeholder="Example: Python">

        <label>Topic</label>
        <textarea id="topic" placeholder="Example: Python Basics"></textarea>

        <label>Study Hours Per Day</label>
        <input type="number" id="hours" min="1" max="12" placeholder="Example: 2">

        <button onclick="getStudyPlan()">Generate Study Plan</button>

        <div id="result"></div>
    </div>

    <!-- Quick Quiz -->
    <div class="card">
        <h2>📝 Quick Quiz</h2>

        <p><b>Question:</b> What is Python?</p>

        <button class="option" onclick="checkAnswer('A')">
            A. A programming language
        </button>

        <button class="option" onclick="checkAnswer('B')">
            B. An operating system
        </button>

        <button class="option" onclick="checkAnswer('C')">
            C. A database
        </button>

        <p id="quizResult"></p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
